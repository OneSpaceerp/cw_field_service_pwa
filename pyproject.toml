[project]
name = "cw_field_service_pwa"
authors = [{ name = "Nest Software Development & C-Water", email = "info@nest-dev.com" }]
description = "Production-grade Mobile PWA for C-Water Field Service (Frappe HRMS Reference Architecture)"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
